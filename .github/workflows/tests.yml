name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    name: Node tests (no browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Projektzentrale daneben holen (spektron-ordner.js byte-gleich prüfen)
        env:
          ZWEIG: ${{ github.head_ref }}
        # gleichnamiger Zweig in der Projektzentrale, falls es ihn gibt (Änderung in mehreren Repos), sonst main
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale
      - run: node tests/spektron-ordner.cjs
        env:
          SPEKTRON_ORDNER_PFLICHT: '1'
      - run: node tests/aufgaben.cjs
      - run: node tests/abrechnung.cjs
  browser-tests:
    name: Browser tests (chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: BüroKit in the real browser
        run: node tests/buerokit-browser.cjs chromium
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
